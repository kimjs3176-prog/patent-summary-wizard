name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # AGENTS.md: npm 10 crashes on this dependency tree; the lockfile is maintained with npm 11.
      - run: npm i -g npm@11

      # Fails when package-lock.json drifts from package.json, which is exactly what we want to catch.
      - run: npm ci --no-audit --no-fund

      - run: npx tsc --noEmit -p tsconfig.app.json

      # App lint gates the build (Deno functions under supabase/functions are checked by the deno job instead).
      - run: npm run lint

      - run: npm test

      - run: npm run build

      # Smoke test: open the production build in a real browser (all outside requests blocked) on desktop and
      # phone widths, and walk the filing helper (public/filing-app) through every step. Playwright is installed
      # without touching the lockfiles.
      - name: Browser smoke test
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/smoke.mjs http://127.0.0.1:4173

      # The committed .env must only ever hold the public (anon) Supabase key.
      - name: Check committed .env holds the anon key only
        run: |
          node -e '
            const fs = require("fs");
            const env = fs.readFileSync(".env", "utf8");
            const m = env.match(/VITE_SUPABASE_PUBLISHABLE_KEY="?([^"\n]+)"?/);
            if (!m) process.exit(0);
            const key = m[1];
            if (!key.startsWith("eyJ")) process.exit(0); // publishable (sb_publishable_…) keys are not JWTs
            const payload = JSON.parse(Buffer.from(key.split(".")[1], "base64url").toString());
            if (payload.role !== "anon") { console.error("non-anon key committed in .env:", payload.role); process.exit(1); }
          '

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  edge-functions:
    name: deno check (edge functions)
    runs-on: ubuntu-latest
    env:
      # Known type debt, reported but not failing the job (space-separated function names). Empty: every function
      # type-checks now (filing-trends, find-my-patents and patent-chat, once listed here, pass deno check), so any
      # new type error fails the job. Add a name only for a debt that cannot be fixed in the same change.
      KNOWN_TYPE_DEBT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Each function is checked from its own directory so a function-level deno.json (filing-api) applies,
      # and every function is checked even when an earlier one fails.
      - run: |
          failed=""
          for dir in supabase/functions/*/; do
            [ -f "$dir/index.ts" ] || continue
            name=$(basename "$dir")
            echo "::group::$name"
            if ! (cd "$dir" && deno check --node-modules-dir=none index.ts); then
              case " $KNOWN_TYPE_DEBT " in
                *" $name "*) echo "::warning::deno check: known type debt in $name" ;;
                *) failed="$failed $name" ;;
              esac
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::deno check failed for:$failed"; exit 1; fi

  lovable-deploy:
    # Lovable Cloud does not deploy Edge Functions or run migrations that arrive through GitHub.
    # This job lists what has to be deployed in Lovable for this change (with a prompt to paste
    # into the Lovable chat) in the run summary. It never fails the build.
    name: Lovable 배포 목록
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: List functions and migrations to deploy
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "비교할 이전 커밋이 없어 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          node scripts/lovable-deploy-list.mjs "$base" HEAD --markdown | tee -a "$GITHUB_STEP_SUMMARY"
