name: Daily security check

on:
  schedule:
    # 09:00 Asia/Seoul (GitHub schedules use UTC; execution may be delayed).
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-daily
  cancel-in-progress: false

jobs:
  secrets:
    name: Secret exposure scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g npm@11
      - name: Audit locked dependencies
        # 배포되는 의존성(운영)은 '보통' 이상이면 실패. 개발 도구(eslint·drizzle-kit 등)는 기록만 남긴다
        run: |
          npm audit --package-lock-only --omit=dev --audit-level=moderate
          npm audit --package-lock-only --audit-level=high || echo "::warning::개발 도구 의존성에 high 이상 취약점이 있습니다"
