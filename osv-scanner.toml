# OSV-Scanner exceptions: verified false positives only.
[[PackageOverrides]]
name = "xlsx"
ecosystem = "npm"
ignore = true
reason = "Installed from the SheetJS CDN tarball (0.20.3); OSV cannot read a version from the URL and reports every xlsx advisory. The app only writes workbooks (PatentExport)."

