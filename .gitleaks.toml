# Gitleaks configuration: keep the default rules and allow only verified false positives.
[extend]
useDefault = true

[allowlist]
description = "Verified false positives: public client settings and cache key names"
regexTarget = "line"
regexes = [
  # Public browser settings generated by Lovable Cloud (publishable anon key, project URL and ID).
  # Private keys are stored as backend secrets and are never written to this file.
  '''^(VITE_)?SUPABASE_(PUBLISHABLE_KEY|URL|PROJECT_ID)\s*=\s*"[^"]*"\s*$''',
  # Cache entry names such as const CACHE_KEY = "filing_trends_v1"; these are labels, not credentials.
  '''\bCACHE_KEY\s*=\s*["'][a-z0-9_]+["']''',
]
