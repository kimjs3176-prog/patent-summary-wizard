      <text x="20" y="84" font-size="24" font-weight="700" fill="#10241C">특허번호</text>
      <text x="20" y="114" font-size="24" font-weight="700" fill="#10241C">입력</text>
      <text x="20" y="154" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#5E7A6C">10-2080834</text>
    </g>
