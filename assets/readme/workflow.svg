      <text x="20" y="44" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#17855F">02</text>
      <text x="20" y="84" font-size="24" font-weight="700" fill="#10241C">원문 수집</text>
      <text x="20" y="124" font-size="20" fill="#3D5A4C">KIPRIS</text>
      <text x="20" y="152" font-size="20" fill="#3D5A4C">초록 · 청구항</text>
    </g>
    <g transform="translate(492 56)">
