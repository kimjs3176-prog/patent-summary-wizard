<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">요약서가 만들어지는 과정</title>
  <desc id="desc">특허번호를 넣으면 KIPRIS에서 초록과 청구항을 가져오고, AI가 쉬운 말로 요약한 뒤 원문에 없는 수치를 지우고, KOSIS 시장 통계와 국가법령 규제 정보를 붙여 A4 2쪽 요약서로 냅니다.</desc>
  <rect width="1200" height="300" rx="26" fill="#F3F7F4"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
    <g transform="translate(48 56)">
