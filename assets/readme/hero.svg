<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Agri IP Summary (AIS)</title>
  <desc id="desc">농식품 국유특허를 특허번호 하나로 A4 2쪽 기술 요약서로 만들어 주는 서비스. 오른쪽은 실제 요약서 두 쪽의 구성(머리 정보, 사업화 점수, 기술 성숙도, 시장 표)을 단순화한 그림이다.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="420" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#10241C"/>
    <!-- 특허번호 자리표: 요약서 머리처럼 번호를 크게 깐 바탕 -->
    <text x="-8" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="112" font-weight="700" fill="#132B21" letter-spacing="-2">10-2080834</text>

    <g id="title-block" transform="translate(64 0)">
      <rect x="0" y="62" width="246" height="34" rx="17" fill="#25A87A" fill-opacity="0.16"/>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#7FE0B8">KIPRIS 국유특허 · AI 기술분석</text>
      <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="58" font-weight="800" fill="#F4F7F2" letter-spacing="-1.5">Agri IP Summary</text>
      <text x="0" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#F4F7F2">특허번호 하나로,</text>
      <rect x="0" y="242" width="420" height="14" rx="3" fill="#25A87A" fill-opacity="0.45"/>
      <text x="0" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#F4F7F2">누구나 읽는 A4 2쪽 기술 요약서</text>
      <text x="0" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif" font-size="20" fill="#A9C4B7">원문 근거 · 사업화 점수 · 시장 통계 · 예상 규제</text>
      <text x="0" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7E9C8E">한국농업기술진흥원 · atipsum.lovable.app</text>
    </g>

    <!-- 요약서 2쪽: 뒤쪽 2/2 -->
    <g id="sheet-2" transform="translate(940 48) rotate(4)">
      <rect width="210" height="297" rx="6" fill="#DDE7E1"/>
      <rect x="18" y="20" width="96" height="8" rx="4" fill="#25A87A"/>
      <rect x="18" y="36" width="160" height="14" rx="3" fill="#10241C"/>
      <rect x="18" y="62" width="174" height="74" rx="4" fill="#FFFFFF" stroke="#B9CBC1"/>
      <line x1="18" y1="86" x2="192" y2="86" stroke="#B9CBC1"/>
      <line x1="18" y1="110" x2="192" y2="110" stroke="#B9CBC1"/>
      <rect x="18" y="150" width="174" height="7" rx="3" fill="#9FB3A8"/>
      <rect x="18" y="164" width="150" height="7" rx="3" fill="#9FB3A8"/>
      <rect x="18" y="186" width="80" height="8" rx="4" fill="#25A87A"/>
      <rect x="18" y="202" width="174" height="7" rx="3" fill="#9FB3A8"/>
      <rect x="18" y="216" width="130" height="7" rx="3" fill="#9FB3A8"/>
      <text x="168" y="282" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#5E7A6C">2 / 2</text>
    </g>

    <!-- 요약서 1쪽: 앞쪽 1/2 -->
    <g id="sheet-1" transform="translate(726 58) rotate(-3)">
      <rect x="6" y="8" width="250" height="330" rx="7" fill="#06140F" fill-opacity="0.35"/>
      <rect width="250" height="330" rx="7" fill="#FFFFFF"/>
      <rect x="0" y="0" width="250" height="96" rx="7" fill="#17352A"/>
      <rect x="0" y="80" width="250" height="16" fill="#17352A"/>
      <rect x="16" y="16" width="70" height="14" rx="7" fill="#7FE0B8"/>
      <rect x="16" y="40" width="200" height="11" rx="3" fill="#F4F7F2"/>
      <rect x="16" y="56" width="150" height="11" rx="3" fill="#F4F7F2"/>
      <text x="16" y="86" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#A9C4B7">10-2080834</text>
      <text x="16" y="138" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="40" font-weight="800" fill="#17855F">81</text>
      <text x="64" y="138" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="13" fill="#5E7A6C">/100 사업화 점수</text>
      <g transform="translate(16 156)">
        <rect x="0" width="22" height="16" fill="#CFE6DA"/><rect x="24" width="22" height="16" fill="#CFE6DA"/><rect x="48" width="22" height="16" fill="#CFE6DA"/>
        <rect x="72" width="22" height="16" fill="#CFE6DA"/><rect x="96" width="22" height="16" fill="#CFE6DA"/><rect x="120" width="22" height="16" fill="#17855F"/>
        <rect x="144" width="22" height="16" fill="#EEF3F0"/><rect x="168" width="22" height="16" fill="#EEF3F0"/><rect x="192" width="22" height="16" fill="#EEF3F0"/>
      </g>
      <text x="16" y="194" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#5E7A6C">기술 성숙도 TRL 6 / 9</text>
      <line x1="16" y1="208" x2="234" y2="208" stroke="#10241C" stroke-width="2"/>
      <rect x="16" y="218" width="110" height="9" rx="2" fill="#10241C"/>
      <rect x="16" y="234" width="218" height="8" rx="2" fill="#25A87A" fill-opacity="0.35"/>
      <rect x="16" y="248" width="218" height="6" rx="3" fill="#B9CBC1"/>
      <rect x="16" y="260" width="190" height="6" rx="3" fill="#B9CBC1"/>
      <line x1="16" y1="278" x2="234" y2="278" stroke="#10241C" stroke-width="2"/>
      <rect x="16" y="288" width="96" height="9" rx="2" fill="#10241C"/>
      <rect x="16" y="304" width="200" height="6" rx="3" fill="#B9CBC1"/>
      <text x="200" y="324" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7E9C8E">1 / 2</text>
    </g>
  </g>
</svg>
